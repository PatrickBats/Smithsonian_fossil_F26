name: Method A data-variant checks

on:
  pull_request:
    paths:
      - 'scripts/method_a/**'
      - 'reports/method_a_data_variants_2026-10-18/**'
      - '.github/workflows/method-a-data-variants.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/method_a/**'
      - 'reports/method_a_data_variants_2026-10-18/**'
      - '.github/workflows/method-a-data-variants.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  method-a-data-variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check configuration, storage boundaries and recorded results
        run: python -m unittest discover -s scripts/method_a/data_variants/tests -v
